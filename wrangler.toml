# Maranasi Outreach Engine — Cloudflare Worker
name = "maranasi-crm"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Single cron trigger. The internal dispatcher (src/jobs/dispatcher.ts) decides
# which job runs on each tick based on UTC time. Do NOT add more schedules.
[triggers]
crons = ["*/15 * * * *"]

[vars]
DRY_RUN = "true"
DAILY_SEND_CAP = "20"

[[d1_databases]]
binding = "DB"
database_name = "maranasi-crm"
database_id = "d1f958ff-a5d3-4e7d-8b69-f15dc774db83"

[[kv_namespaces]]
binding = "KV"
id = "35de807c8d26456292f0852508e0595d"

# Secrets (set with `wrangler secret put <NAME>`):
#   ADMIN_API_KEY
#   OPENROUTER_API_KEY            <- one key drives all LLM calls (preferred)
#   ANTHROPIC_API_KEY             <- optional fallback provider (Anthropic direct)
#   GOOGLE_PLACES_API_KEY,
#   GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN,
#   RECAP_EMAIL, SENDER_EMAIL, SENDER_NAME, VERIFIER_API_KEY (optional)
# Optional vars: OPENROUTER_MODEL_AGENT (default anthropic/claude-sonnet-4.6),
#                OPENROUTER_MODEL_FAST  (default anthropic/claude-haiku-4.5)
